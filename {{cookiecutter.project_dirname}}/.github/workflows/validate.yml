# {%- raw %}
name: Validate
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  __DEVTOOLS_CACHE_DIR: ${{ github.workspace }}/.cache/devtools
  GHA_CHECK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets devtools/gha-check-run.py report per-tool check runs. Not
      # granted on fork PRs (read-only token there) - the script detects
      # that and falls back to running tools with no reporting. Scoped to
      # this job rather than the whole workflow (only job that needs it).
      checks: write # see comment above (zizmor only reads same-line comments)
      # Lets devtools/gha-check-run.py upload SARIF output to Code Scanning.
      # Same fork-PR degradation as checks: write above.
      security-events: write # see comment above
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache devtools state (tools, python, lint/test caches)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.__DEVTOOLS_CACHE_DIR }}
          # restore-keys only match as a literal prefix of a saved key, so
          # the key is built from one hashFiles() call per file (not one
          # hashFiles() over several files, which produces a single opaque
          # hash no prefix can partially match) - ordered from least to most
          # frequently changing, so each restore-keys tier below is a valid
          # prefix of a broader, still-useful cache.
          key: devtools-${{ github.job }}-v1-${{ hashFiles('.mise.toml') }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            devtools-${{ github.job }}-v1-${{ hashFiles('.mise.toml') }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('pyproject.toml') }}-
            devtools-${{ github.job }}-v1-${{ hashFiles('.mise.toml') }}-${{ hashFiles('mise.lock') }}-
            devtools-${{ github.job }}-v1-${{ hashFiles('.mise.toml') }}-
            devtools-${{ github.job }}-v1-
      - name: Install mise
        # Only the mise binary - the tools it manages are installed by
        # `task configure` (`mise install`) into the cached data dir below.
        # CI runs mise directly on the runner rather than through the
        # docker-compose `devtools` service: same pinned toolchain either way,
        # and the container is one less moving part here.
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Run validation
        run: |
          set -x -Eeuo pipefail
          mise exec -- task --output group \
            --output-group-begin '::group::{{.TASK}}' \
            --output-group-end '::endgroup::' \
            configure validate
        env:
          # mise needs this for GitHub API calls (tool version resolution,
          # uv's artifact attestation check) or it hits the unauthenticated
          # rate limit almost immediately; gha-check-run.py needs it too.
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          MISE_DATA_DIR: ${{ env.__DEVTOOLS_CACHE_DIR }}/mise/data
          MISE_CACHE_DIR: ${{ env.__DEVTOOLS_CACHE_DIR }}/mise/cache
          UV_CACHE_DIR: ${{ env.__DEVTOOLS_CACHE_DIR }}/uv
          UV_PYTHON_INSTALL_DIR: ${{ env.__DEVTOOLS_CACHE_DIR }}/uv/python
          RUFF_CACHE_DIR: ${{ env.__DEVTOOLS_CACHE_DIR }}/ruff
          MYPY_CACHE_DIR: ${{ env.__DEVTOOLS_CACHE_DIR }}/mypy
          VALIDATE_PARALLEL: "true"
          OUTPUT_SARIF: "true"
      - name: Report check results
        if: always()
        run: python3 ./devtools/gha-check-run.py finalize
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
# {%- endraw %}
