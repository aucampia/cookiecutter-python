# https://docs.docker.com/reference/compose-file/
# https://docs.docker.com/compose/how-tos/environment-variables/variable-interpolation/
services:
  devtools:
    image: ghcr.io/jdx/mise:2026.8.10@sha256:f2d637d5e5189f7ec177b73bce5cd5db7e7b17a4f466f887c1b88ac2dd431129
    entrypoint: ["mise", "exec", "--"]
    restart: "no"
    profiles:
      - devtools
    working_dir: /srv/workspace
    environment:
      # Passed through from the host/CI shell if set - mise needs it for
      # GitHub API calls (tool version resolution, uv's artifact attestation
      # check) or it quickly hits the unauthenticated rate limit.
      - GITHUB_TOKEN
      # Passed through so devtools/gha-check-run.py (see Taskfile.yml's
      # CHECK_RUN_PREFIX) can report each leaf task as its own check run.
      - GITHUB_ACTIONS
      - GITHUB_REPOSITORY
      - GITHUB_API_URL
      - GITHUB_SERVER_URL
      - GITHUB_RUN_ID
      - GITHUB_RUN_ATTEMPT
      - GHA_CHECK_HEAD_SHA
      - GITHUB_REF
      - VALIDATE_PARALLEL
      - OUTPUT_SARIF
      - MISE_TRUSTED_CONFIG_PATHS=/srv/workspace
      - XDG_CACHE_HOME=/srv/__devtools/cache
      - UV_CACHE_DIR=/srv/__devtools/cache/uv
      - UV_PYTHON_INSTALL_DIR=/srv/__devtools/cache/uv/python
      - MISE_DATA_DIR=/srv/__devtools/cache/mise/data
      - MISE_CACHE_DIR=/srv/__devtools/cache/mise/cache
      - RUFF_CACHE_DIR=/srv/__devtools/cache/ruff
      - MYPY_CACHE_DIR=/srv/__devtools/cache/mypy
      - PYTEST_ADDOPTS=-o cache_dir=/srv/__devtools/cache/pytest
      - COVERAGE_FILE=/srv/__devtools/cache/coverage/.coverage
    volumes:
      - .:/srv/workspace:z
      - ${__DEVTOOLS_CACHE_DIR:-devtools-cache}:/srv/__devtools/cache
      - devtools-venv:/srv/workspace/.venv
  renovate:
    image: docker.io/renovate/renovate:latest@sha256:e6b93e709ca64495ab9307350b260064276ee02d15c6886387fd2d42c926623b
    profiles:
      - renovate
    restart: "no"
    environment:
      # https://docs.renovatebot.com/config-overview/#logging-variables
      RENOVATE_TOKEN: ${RENOVATE_TOKEN}
      RENOVATE_GITHUB_ACTIONS_TOKEN: ${RENOVATE_GITHUB_ACTIONS_TOKEN}
      RENOVATE_CONFIG_FILE: /srv/workspace/renovate-global.json5
      RENOVATE_REPOSITORY_CACHE: ${RENOVATE_REPOSITORY_CACHE:-enabled}
      RENOVATE_AUTO_APPROVE: ${RENOVATE_AUTO_APPROVE:-false}
      LOG_LEVEL: ${RENOVATE_LOG_LEVEL:-info}
      RENOVATE_DRY_RUN: ${RENOVATE_DRY_RUN:-}
    volumes:
      - .:/srv/workspace
      - renovate-tmp:/tmp/renovate
    # Bypasses the image's own entrypoint, which the command below replaces
    # with the parts of it that are actually needed.
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -Eeuo pipefail

        declare -p LOG_LEVEL RENOVATE_REPOSITORY_CACHE RENOVATE_AUTO_APPROVE RENOVATE_DRY_RUN >&2

        # Code below comes from:
        # docker run --rm -i docker.io/renovate/renovate:latest cat /usr/local/sbin/renovate-entrypoint.sh
        # docker run --rm -i docker.io/renovate/renovate:latest cat /usr/local/sbin/docker-entrypoint.sh

        export GIT_TRACE=/tmp/renovate/git-trace.log
        echo -n > /tmp/renovate/git-trace.log

        dump_logs() {
          if [ "$${LOG_LEVEL}" == "debug" ]; then
            echo "GIT_TRACE logs:" >&2
            cat /tmp/renovate/git-trace.log >&2
          fi
        }

        trap dump_logs EXIT

        source /usr/local/etc/env
        renovate

        /srv/workspace/devtools/renovate/postprocess.sh

        echo "Renovate finished successfully." >&2
volumes:
  devtools-cache: {}
  devtools-venv: {}
  renovate-tmp: {}
