# https://www.python.org/dev/peps/pep-0621/
[project]
# 
name = "example.project.defaults"
version = "0.0.0"
requires-python = ">=3.14,<4"
# 

description = ""
authors = []
readme = "README.md"
# 

dependencies = [
    "pyyaml>=6.0.3,<7.0.0",
    "pydantic>=2.13.4,<3.0.0",
# 
    "typer>=0.27.1,<0.28.0",
# 
# 
    "structlog>=26.1.0,<27.0.0",
# 
]


# 
[project.scripts]
"example.project.defaults-cli" = "example.project.defaults.cli:main"
# 

[dependency-groups]
dev = [
    "codespell>=2.4.3,<3.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.2,<0.17.0",
    "types-pyyaml>=6.0.12.20260724,<7.0.0.0",
    "typing-extensions>=4.16.0,<5.0.0",
# 
]

[tool.uv]
default-groups = [
    "dev",
]

[tool.hatch.build.targets.source]
include = ["src/**"]
sources = ["src"]

[tool.hatch.build.targets.wheel]
include = ["src/**"]
sources = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.codespell]
ignore-words = ".codespellignore"

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# 
target-version = "py314"
# 

[tool.ruff.lint]
# https://beta.ruff.rs/docs/configuration/
preview = true
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "N", # pep8-naming
    "RUF", # Ruff
    "UP", # pyupgrade
    "FA", # flake8-future-annotations
    "ANN", # flake8-annotations
    "PLE", # Pylint Error
    "FAST", # FastAPI
    "ASYNC", # flake8-async
    "B", # flake8-bugbear
    "S", # flake8-bandit
]

ignore = [
    "line-too-long", # line too long:
    # Disabled based on black recommendations
    # https://black.readthedocs.io/en/stable/faq.html#why-are-flake8-s-e203-and-w503-violated
    "whitespace-before-punctuation", # whitespace before ':'
    "missing-whitespace", # missing whitespace after ','
    "unexpected-spaces-around-keyword-parameter-equals", # Unexpected spaces around keyword / parameter equals
    # Disabled because this targets Python 3.9 or later
    "non-pep604-annotation-union", # Use `X | Y` for type annotations
    "non-pep604-annotation-optional", # Use `X | None` for type annotations
    "any-type", # Dynamically typed expressions (typing.Any) are disallowed in {name}
    "assert", # Use of assert detected.
    "suspicious-subprocess-import", # subprocess module is possibly insecure
    "start-process-with-partial-path", # Starting a process with a partial executable path
    # Every subprocess call in this repo runs a fixed, repo-local command line.
    "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
    "suspicious-pickle-import", # pickle, cPickle, dill, and shelve modules are possibly insecure
    "non-empty-init-module", # __init__ module should not contain any code
]

[tool.ruff.lint.per-file-ignores]
# urllib.request.urlopen against the (https) GitHub API - the URL is built
# from GITHUB_API_URL, not from untrusted input.
"devtools/gha-check-run.py" = ["suspicious-url-open-usage"]

[tool.ruff.format]

[tool.coverage.report]
# https://coverage.readthedocs.io/en/coverage-5.0/config.html
show_missing = true

[tool.pytest.ini_options]
# https://docs.pytest.org/en/stable/customize.html
# https://docs.pytest.org/en/stable/reference.html#configuration-options
testpaths = ["tests"]
addopts = ["--cov-config=pyproject.toml", "--cov=src"]
log_format = "%(asctime)s %(process)d %(thread)d %(levelno)03d:%(levelname)-8s %(name)-12s %(module)s:%(lineno)s:%(funcName)s %(message)s"
log_date_format = "%Y-%m-%dT%H:%M:%S"
log_cli_format = "%(asctime)s %(process)d %(thread)d %(levelno)03d:%(levelname)-8s %(name)-12s %(module)s:%(lineno)s:%(funcName)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S"
asyncio_mode = "auto"

[tool.mypy]
# https://mypy.readthedocs.io/en/stable/config_file.html
files = "src,tests,devtools"
mypy_path = "src"
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# 
