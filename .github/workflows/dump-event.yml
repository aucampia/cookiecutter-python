name: dump-event
on: pull_request_target
concurrency:
  group: >
    ${{ github.repository }}-
    ${{ github.workflow }}-
    ${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  dump-event:
    name: dump-event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # only uploads an artifact, which needs no extra scopes
    steps:
      - name: Dump contexts
        # Via env rather than inline `${{ ... }}` in the script: the github
        # context carries attacker-controllable strings on pull_request_target,
        # and inline expansion would splice them into the shell source.
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          ENV_CONTEXT: ${{ toJson(env) }}
        run: |
          set -Eeuo pipefail
          mkdir -vp objects/
          printf '%s\n' "${GITHUB_CONTEXT}" > objects/github.json
          printf '%s\n' "${ENV_CONTEXT}" > objects/env.json
      - name: Upload contexts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dump-event
          path: objects/
          retention-days: 1
