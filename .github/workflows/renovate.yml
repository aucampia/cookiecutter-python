name: renovate

on:
  workflow_dispatch:
    inputs:
      repoCache:
        description: 'Reset or disable the cache?'
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        description: 'Log level'
        type: choice
        default: info
        options:
          - debug
          - info
      autoApprove:
        description: 'Automatically approve Renovate PRs?'
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      # Lets this workflow be dispatched against a branch to test a
      # renovate-global.json5 or workflow change before merging it, without
      # touching any branch, PR or comment - see `task renovate:gha:run`.
      dryRun:
        description: 'Dry-run mode (no branches, PRs or comments)'
        type: choice
        default: disabled
        options:
          - disabled
          - full
          - lookup
          - extract
  schedule:
    - cron: 0 10 * * *

concurrency:
  group: >
    ${{ github.repository }}-
    ${{ github.workflow }}-
    ${{ github.ref }}-
    ${{ contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref) && format( '{0}-{1}', github.run_id, github.sha ) || '' }}
  cancel-in-progress: true

env:
  RENOVATE_CACHE_ARCHIVE: /tmp/renovate-cache.tar.gz
  RENOVATE_REPORT_FILE: /tmp/renovate-report.json
  RENOVATE_CACHE_KEY: renovate-cache
  BUILDKIT_PROGRESS: plain

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pull-requests: write # This is here so PR's can be approved.
      actions: read # dawidd6/action-download-artifact reads prior runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        if: github.event.inputs.repoCache != 'disabled'
        continue-on-error: true
        with:
          name: ${{ env.RENOVATE_CACHE_KEY }}
          path: /tmp
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run renovate
        run: |
          set -x -Eeuo pipefail
          # Renovate only accepts extract/lookup/full, so "disabled" - which
          # exists to give the dispatch input a readable off switch - becomes
          # the empty value Renovate treats as "not a dry run".
          if [ "${RENOVATE_DRY_RUN}" == "disabled" ]; then
            export RENOVATE_DRY_RUN=""
          fi
          exec task renovate
        env:
          RENOVATE_REPOSITORY_CACHE: ${{ github.event.inputs.repoCache || 'enabled' }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
          # `github.event.inputs` only exists for workflow_dispatch, so this
          # fallback is what the scheduled run gets - and the scheduled run is
          # the one that has to approve, since everything here automerges. A
          # dispatch always carries the input, defaulted to "true" above, and
          # `task renovate:gha:run` passes "false" explicitly.
          RENOVATE_AUTO_APPROVE: "${{ github.event.inputs.autoApprove || 'true' }}"
          RENOVATE_DRY_RUN: "${{ github.event.inputs.dryRun || 'disabled' }}"

      # A dry run does not upload its cache: the artifact is shared with the
      # scheduled run on main, and a branch under test should not be able to
      # poison it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event.inputs.repoCache != 'disabled' && (github.event.inputs.dryRun || 'disabled') == 'disabled'
        with:
          name: ${{ env.RENOVATE_CACHE_KEY }}
          path: ${{ env.RENOVATE_CACHE_ARCHIVE }}
          retention-days: 1

      - name: Export Renovate report
        if: always()
        run: |
          set -x -Eeuo pipefail
          exec task renovate:report:export
        env:
          RENOVATE_REPORT_FILE: ${{ env.RENOVATE_REPORT_FILE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: renovate-report
          path: ${{ env.RENOVATE_REPORT_FILE }}
          retention-days: 5
