# https://taskfile.dev/usage/
# https://pkg.go.dev/text/template
# https://go-task.github.io/slim-sprig/
version: "3"
set: [errexit, nounset, pipefail]
env:
  RENOVATE_CACHE_ARCHIVE: '{{.RENOVATE_CACHE_ARCHIVE | default "/tmp/renovate-cache.tar.gz"}}'
  RENOVATE_REPORT_FILE: '{{.RENOVATE_REPORT_FILE | default "/tmp/renovate-report.json"}}'
vars:
  PYTHON: python3
  RUN_PREFIX: "uv run"
  RUN_PYTHON: "{{.RUN_PREFIX}} python"
  # link_project/ is a symlink to the cookiecutter template directory, so the
  # template's own Python (pkg_files/, devtools/) is linted and type-checked
  # alongside this repo's.
  PY_SOURCE: "hooks tests link_project/pkg_files link_project/devtools"
  # ruff's formatter is Python-only (silently no-ops on pyproject.toml), but
  # `ruff check` also lints ruff's own [tool.ruff] config section (e.g.
  # rule-codes-in-selectors), so pyproject.toml is only added to the lint
  # source list, not PY_SOURCE (which format/codespell also use).
  RUFF_LINT_SOURCE: "{{.PY_SOURCE}} pyproject.toml"
  # "." rather than an explicit file list: .yamlfmt.yaml already excludes the
  # noise, and this way the template's and the generated examples' YAML is
  # covered too.
  YAML_SOURCE: "."
  # `|| true` so the Taskfile still parses outside a git work tree.
  SH_FILES:
    sh: git -c safe.directory='*' ls-files -- '*.sh' 2>/dev/null || true
  # examples/ is generated output - its markdown comes from the template, which
  # is linted via link_project/.
  MD_FILES:
    sh: git -c safe.directory='*' ls-files -- '*.md' ':!:examples/*' 2>/dev/null || true
  # Explicit file list rather than letting actionlint discover workflows: it
  # only ever discovers the repo root's, and needs a git work tree to do even
  # that. Tracked files only, like SH_FILES/MD_FILES, so untracked local
  # scratch workflows do not fail validation. Includes the generated examples'
  # workflows - that is where the template's own copy gets linted for real,
  # since unrendered it is wrapped in Jinja markers.
  WORKFLOW_FILES:
    sh: git -c safe.directory='*' ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml' 'examples/*/.github/workflows/*.yml' 'examples/*/.github/workflows/*.yaml' 2>/dev/null || true
  RUFF_FORMAT: "{{.RUN_PREFIX}} ruff format --config pyproject.toml"
  RUFF_LINT: "{{.RUN_PREFIX}} ruff check --config pyproject.toml"
  YAMLFMT: "mise exec -- yamlfmt"
  SHFMT: "mise exec -- shfmt"
  RUMDL: "mise exec -- rumdl"
  # env -u: zizmor requires GH_TOKEN/GITHUB_TOKEN/ZIZMOR_GITHUB_TOKEN to be
  # either unset or non-empty - an empty-but-set value errors outright, even
  # with --offline (which never uses it). --offline never needs a token, so
  # the three are unset unconditionally rather than only when empty.
  ZIZMOR: >-
    env -u GH_TOKEN -u GITHUB_TOKEN -u ZIZMOR_GITHUB_TOKEN mise exec -- zizmor --persona pedantic --min-severity informational --min-confidence high --offline
  CHECK_RUN_PREFIX: >-
    {{if env "GITHUB_ACTIONS"}}{{.PYTHON}} devtools/gha-check-run.py run --data {{(dict "task" .TASK) | mustToJson | q}} --{{end}}
  # Same as CHECK_RUN_PREFIX, but tells gha-check-run.py the wrapped command's
  # stdout is a SARIF document (for upload to Code Scanning) rather than plain
  # log text - see the zizmor task.
  CHECK_RUN_PREFIX_SARIF: >-
    {{if env "GITHUB_ACTIONS"}}{{.PYTHON}} devtools/gha-check-run.py run --data {{(dict "task" .TASK) | mustToJson | q}} --output-is-sarif --{{end}}
  VALIDATE_PARALLEL: '{{.VALIDATE_PARALLEL | default "false"}}'
  OUTPUT_SARIF: '{{.OUTPUT_SARIF | default "false"}}'
tasks:
  configure:
    desc: Configure this project
    cmds:
      # mise (task/yamlfmt/shfmt/shellcheck/rumdl/zizmor/actionlint/uv) must be
      # installed before uv itself can be invoked.
      - "mise install"
      - "uv sync {{.CLI_ARGS}}"
  update:
    desc: Update dependencies
    cmds:
      - uv lock --upgrade {{.CLI_ARGS}}
  update:ranges:
    desc: Update dependency ranges
    env:
      SCRIPT: |
        import re, subprocess, tomllib

        def pkg_name(spec):
            return re.split(r"[><=~!@;]", spec)[0]

        with open("pyproject.toml", "rb") as f:
            data = tomllib.load(f)

        groups = []
        deps = [pkg_name(d) for d in data.get("project", {}).get("dependencies", [])]
        if deps:
            groups.append((None, deps))
        for group, pkgs in data.get("dependency-groups", {}).items():
            group_deps = [pkg_name(p) for p in pkgs if isinstance(p, str)]
            if group_deps:
                groups.append((group, group_deps))

        for group, pkgs in groups:
            args = ["--group", group] if group else []
            subprocess.run(["uv", "remove"] + args + pkgs, check=True)
            subprocess.run(["uv", "add", "--bounds=major"] + args + pkgs, check=True)
    cmds:
      - uv run python -c "$SCRIPT"
  ruff:format:check:
    desc: Check Python formatting with ruff
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_FORMAT}} --check --diff {{.CLI_ARGS | default .PY_SOURCE}}"
  ruff:format:fix:
    desc: Format Python with ruff
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_FORMAT}} {{.CLI_ARGS | default .PY_SOURCE}}"
  ruff:lint:
    desc: Run ruff linter
    vars:
      # OUTPUT_SARIF switches this task to a SARIF-only invocation (no plain
      # diagnostics) so gha-check-run.py can upload results to Code Scanning
      # - same pattern as the zizmor task.
      RUFF_LINT_FORMAT: '{{if (mustFromJson .OUTPUT_SARIF)}}--output-format sarif{{end}}'
      RUFF_LINT_PREFIX: '{{if (mustFromJson .OUTPUT_SARIF)}}{{.CHECK_RUN_PREFIX_SARIF}}{{else}}{{.CHECK_RUN_PREFIX}}{{end}}'
    cmds:
      - "{{.RUFF_LINT_PREFIX}} {{.RUFF_LINT}} {{.RUFF_LINT_FORMAT}} {{.CLI_ARGS | default .RUFF_LINT_SOURCE}}"
  ruff:lint:fix:
    desc: Run ruff linter with autofix
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUFF_LINT}} --fix-only {{.CLI_ARGS | default .RUFF_LINT_SOURCE}}"
  mypy:
    desc: Run mypy
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PYTHON}} -m mypy --show-error-context --show-error-codes {{.CLI_ARGS}}"
  codespell:
    desc: Run codespell
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PREFIX}} codespell {{.CLI_ARGS | default .PY_SOURCE}}"
  yamlfmt:
    desc: Check YAML formatting
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.YAMLFMT}} -lint {{.CLI_ARGS | default .YAML_SOURCE}}"
  yamlfmt:fix:
    desc: Format YAML
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.YAMLFMT}} {{.CLI_ARGS | default .YAML_SOURCE}}"
  shfmt:
    desc: Check shell script formatting
    status:
      - '[ -z "{{.SH_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.SHFMT}} -l -d {{.SH_FILES | catLines}}"
  shfmt:fix:
    desc: Format shell scripts
    status:
      - '[ -z "{{.SH_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.SHFMT}} -w {{.SH_FILES | catLines}}"
  shellcheck:
    desc: Run shellcheck
    status:
      - '[ -z "{{.SH_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} mise exec -- shellcheck {{.SH_FILES | catLines}}"
  rumdl:check:
    desc: Run rumdl markdown linter
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    vars:
      # OUTPUT_SARIF switches this task to a SARIF-only invocation (no plain
      # diagnostics) so gha-check-run.py can upload results to Code Scanning
      # - same pattern as the zizmor task.
      RUMDL_CHECK_FORMAT: '{{if (mustFromJson .OUTPUT_SARIF)}}--output-format sarif{{end}}'
      RUMDL_CHECK_PREFIX: '{{if (mustFromJson .OUTPUT_SARIF)}}{{.CHECK_RUN_PREFIX_SARIF}}{{else}}{{.CHECK_RUN_PREFIX}}{{end}}'
    cmds:
      - "{{.RUMDL_CHECK_PREFIX}} {{.RUMDL}} check {{.RUMDL_CHECK_FORMAT}} {{.MD_FILES | catLines}}"
  rumdl:check:fix:
    desc: Run rumdl markdown linter with autofix
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} check --fix {{.MD_FILES | catLines}}"
  rumdl:format:check:
    desc: Check markdown formatting with rumdl
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} fmt --check {{.MD_FILES | catLines}}"
  rumdl:format:fix:
    desc: Format markdown with rumdl
    status:
      - '[ -z "{{.MD_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUMDL}} fmt {{.MD_FILES | catLines}}"
  zizmor:
    desc: Run zizmor (GitHub Actions security linter)
    status:
      - '[ -z "{{.WORKFLOW_FILES | trim}}" ]'
    vars:
      # OUTPUT_SARIF switches this task to a SARIF-only invocation (no plain
      # diagnostics) so gha-check-run.py can upload results to Code Scanning.
      ZIZMOR_FORMAT: '{{if (mustFromJson .OUTPUT_SARIF)}}--format sarif{{end}}'
      ZIZMOR_PREFIX: '{{if (mustFromJson .OUTPUT_SARIF)}}{{.CHECK_RUN_PREFIX_SARIF}}{{else}}{{.CHECK_RUN_PREFIX}}{{end}}'
    cmds:
      - "{{.ZIZMOR_PREFIX}} {{.ZIZMOR}} {{.ZIZMOR_FORMAT}} {{.WORKFLOW_FILES | catLines}}"
  zizmor:fix:
    desc: Run zizmor with autofix
    status:
      - '[ -z "{{.WORKFLOW_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.ZIZMOR}} --fix {{.WORKFLOW_FILES | catLines}}"
  actionlint:
    desc: Run actionlint (GitHub Actions workflow linter)
    status:
      - '[ -z "{{.WORKFLOW_FILES | trim}}" ]'
    cmds:
      - "{{.CHECK_RUN_PREFIX}} mise exec -- actionlint {{.CLI_ARGS | default (.WORKFLOW_FILES | catLines)}}"
  pip-audit:
    desc: Run pip audit
    cmds:
      - |
        uv export --all-groups --no-emit-project --format requirements.txt | \
          {{.RUN_PYTHON}} -m pip_audit --requirement /dev/stdin --no-deps --strict --desc on
  test:
    desc: Run tests
    cmds:
      - "{{.CHECK_RUN_PREFIX}} {{.RUN_PYTHON}} -m pytest {{.CLI_ARGS}}"
  validate:static:
    desc: Perform static validation
    vars:
      STATIC_CHECKS: >-
        mypy codespell ruff:format:check ruff:lint yamlfmt shfmt shellcheck rumdl:format:check rumdl:check zizmor actionlint
      # Exactly one of these is non-empty. An empty `for` var expands to zero
      # iterations, so the unused branch disappears entirely.
      STATIC_DEPS: '{{if (mustFromJson .VALIDATE_PARALLEL)}}{{.STATIC_CHECKS}}{{end}}'
      STATIC_CMDS: '{{if (mustFromJson .VALIDATE_PARALLEL)}}{{else}}{{.STATIC_CHECKS}}{{end}}'
    deps:
      - for: {var: STATIC_DEPS}
        task: "{{.ITEM}}"
    cmds:
      - cmd: |
          {{if (mustFromJson .VALIDATE_PARALLEL)}}
          echo "Ran the '{{.TASK}}' task in parallel..." >&2
          {{else}}
          echo "Running the '{{.TASK}}' task sequentially..." >&2
          {{end}}
        silent: true
      - for: {var: STATIC_CMDS}
        task: "{{.ITEM}}"
  validate:fix:
    desc: Fix auto-fixable validation errors.
    # Always sequential - fixer order matters (ruff:lint:fix before
    # ruff:format:fix, rumdl:format:fix before rumdl:check:fix).
    vars:
      STATIC_FIXES: >-
        ruff:lint:fix ruff:format:fix yamlfmt:fix shfmt:fix rumdl:format:fix rumdl:check:fix zizmor:fix
    cmds:
      - for: {var: STATIC_FIXES}
        task: "{{.ITEM}}"
  validate:
    desc: Perform all validation
    vars:
      VALIDATE_TASKS: "validate:static test"
      VALIDATE_DEPS: '{{if (mustFromJson .VALIDATE_PARALLEL)}}{{.VALIDATE_TASKS}}{{end}}'
      VALIDATE_CMDS: '{{if (mustFromJson .VALIDATE_PARALLEL)}}{{else}}{{.VALIDATE_TASKS}}{{end}}'
    deps:
      - for: {var: VALIDATE_DEPS}
        task: "{{.ITEM}}"
    cmds:
      - cmd: |
          {{if (mustFromJson .VALIDATE_PARALLEL)}}
          echo "Ran the '{{.TASK}}' task in parallel..." >&2
          {{else}}
          echo "Running the '{{.TASK}}' task sequentially..." >&2
          {{end}}
        silent: true
      - for: {var: VALIDATE_CMDS}
        task: "{{.ITEM}}"
  fix-and-validate:
    desc: Perform all validation
    cmds:
      - task: validate:fix
      - task: validate
  uv:clean:
    desc: Clean virtualenv
    cmds:
      - uv run --no-sync printenv VIRTUAL_ENV | xargs -t rm -rv
  clean:
    desc: Clean everything
    cmds:
      - task: _rimraf
        vars: {RIMRAF_TARGET: ".mypy_cache"}
      - task: _rimraf
        vars: {RIMRAF_TARGET: ".pytest_cache"}
      - task: _rimraf
        vars: {RIMRAF_TARGET: ".venv"}
      - task: uv:clean
  default:
    desc: Run validate
    cmds:
      - task: validate
  uv:
    desc: Run uv
    interactive: true
    cmds:
      - "uv {{.CLI_ARGS}}"
  venv:run:
    desc: Run args in the venv
    interactive: true
    cmds:
      - "{{.RUN_PREFIX}} {{.CLI_ARGS}}"
  venv:python:
    desc: Run python in the venv
    interactive: true
    cmds:
      - "{{.RUN_PYTHON}} {{.CLI_ARGS}}"
  example:generate:
    desc: Generate an example
    preconditions:
      - sh: |
          [ -n {{.EXAMPLE_NAME | default "" | shellQuote}} ]
        msg: "EXAMPLE_NAME is required"
    cmds:
      - task: _rimraf
        vars: {RIMRAF_TARGET: "examples/example.project.{{.EXAMPLE_NAME}}"}
      - "{{.RUN_PYTHON}} -m cookiecutter ./ -o examples --no-input --config-file tests/data/cookie-config/{{.EXAMPLE_NAME}}.yaml"
  example:run:
    desc: Run an example
    preconditions:
      - sh: |
          [ -n {{.EXAMPLE_NAME | default "" | shellQuote}} ]
        msg: "EXAMPLE_NAME is required"
    cmds:
      - cmd: |
          set -euo pipefail
          cd examples/example.project.{{.EXAMPLE_NAME}}
          uv sync
          # env -u GITHUB_ACTIONS: without it the example's own tasks publish
          # GitHub check runs under the same names this repo's tasks use.
          env -u GITHUB_ACTIONS uv run task validate:fix validate
          if [ "{{.EXAMPLE_NAME}}" != "nocode" ] ; then
            uv run example.project.{{.EXAMPLE_NAME}}-cli --help
            uv run example.project.{{.EXAMPLE_NAME}}-cli sub leaf --help
          else
            echo "No CLI to run for nocode example."
          fi
        # - "(cd examples/example.project.{{.EXAMPLE_NAME}} && {{.POETRY}} install --sync)"
        # - "(cd examples/example.project.{{.EXAMPLE_NAME}} && {{.POETRY}} run task validate:fix validate)"
        # - "(cd examples/example.project.{{.EXAMPLE_NAME}} && {{.POETRY}} run example.project.{{.EXAMPLE_NAME}}-cli --help)"
        # - "(cd examples/example.project.{{.EXAMPLE_NAME}} && {{.POETRY}} run example.project.{{.EXAMPLE_NAME}}-cli sub leaf --help)"
  examples:generate:
    desc: Generate all examples
    cmds:
      - for: ['basic', 'defaults', 'minimal', 'minimal_typer', 'nocode']
        task: example:generate
        vars: {EXAMPLE_NAME: "{{.ITEM}}"}
  examples:run:
    desc: Run all examples
    cmds:
      - for: ['basic', 'defaults', 'minimal', 'minimal_typer', 'nocode']
        task: example:run
        vars: {EXAMPLE_NAME: "{{.ITEM}}"}
  examples:clean:
    desc: Clean examples
    cmds:
      - task: _rimraf
        vars: {RIMRAF_TARGET: "examples"}
  _rimraf:
    # This task is a utility task for recursively removing directories, it is
    # similar to rm -rf but not identical and it should work wherever there is
    # a python interpreter. The name is inspired by
    # <https://www.npmjs.com/package/rimraf>.
    - cmd: |
        {{.PYTHON}} -c '
        from pathlib import Path;
        import sys, shutil;
        for path in sys.argv[1:]:
          if Path(path).exists():
            sys.stderr.write(f"removing {path}\n")
            shutil.rmtree(path, ignore_errors=True)
        ' {{.RIMRAF_TARGET}}

  # renovate:rotate-keypair:
  #   cmds:
  #     - |
  #       set -euo pipefail
  #       PRIVATE_KEY="$(openssl genrsa 4096)"
  #       PUBLIC_KEY="$(ssh-keygen -y -f /dev/stdin <<< "${PRIVATE_KEY}")"

  #       gh secret set RENOVATE_GIT_SSH_PRIVATE_KEY <<< "${PRIVATE_KEY}"

  #       gh repo deploy-key list --json 'title,id' |
  #         jq -r '.[] | select(.title == "renovate") | .id' |
  #         xargs --no-run-if-empty -n1 -t gh repo deploy-key delete

  #       gh repo deploy-key add --allow-write --title 'renovate' /dev/stdin <<< "${PUBLIC_KEY}"

  renovate:update-token:
    vars:
      REPO_INFO:
        sh: gh repo view --json owner,name
      GITHUB_REPOSITORY: |
        {{- with $repo_info := .REPO_INFO | mustFromJson -}}
          {{- $repo_info.owner.login -}}/{{- $repo_info.name -}}
        {{- end -}}
      # Permissions are based off
      # https://docs.renovatebot.com/modules/platform/github/#running-using-a-fine-grained-token
      # and
      # https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens#pre-filling-fine-grained-personal-access-token-details-using-url-parameters
      PAT_URL: "https://github.com/settings/personal-access-tokens/new?name={{print \"Renovate - \" .GITHUB_REPOSITORY | urlquery}}&description={{print \"Token used by Renovate for \" .GITHUB_REPOSITORY | urlquery}}&target_name={{(.REPO_INFO | mustFromJson).owner.login}}&expires_in=356&members=read&statuses=write&contents=write&vulnerability_alerts=read&issues=write&pull_requests=write&workflows=write"
    cmds:
      - cmd: |
          cat <<'EOF'
          Generate a PAT with the following permissions and paste it here.
          - Contents: Read and write (Level: Repository or Organization)
          - Issues: Read and write (Level: Repository or Organization)
          - Pull requests: Read and write (Level: Repository or Organization)
          - Commit statuses: Read and write (Level: Repository or Organization)
          - Dependabot alerts: Read-only (Level: Repository or Organization)
          - Members:	Read-only	(Level: Organization)
          - Workflows: Read and write (Level: Repository or Organization)

          For "Repository access", select "Only select repositories" and
          then select "{{.GITHUB_REPOSITORY}}".

          ⚠️ Make sure to delete any old tokens after generating a new token ⚠️

          The following URL should take you to a page with most
          parameters except "Repository access" pre-filled:
          {{.PAT_URL}}
          EOF
        silent: true
      - |
        echo "Paste your PAT here:"
        read -r RENOVATE_TOKEN
        gh secret set RENOVATE_TOKEN <<< "${RENOVATE_TOKEN}"

  renovate:dry-run:
    cmds:
      - |
        RENOVATE_TOKEN="$(gh auth token)" RENOVATE_DRY_RUN=full RENOVATE_LOG_LEVEL=debug \
        task renovate 2>&1 |
        tee renovate-output.log

  renovate:
    desc: Run renovate
    cmds:
      # Fail fast on a broken global config instead of letting Renovate boot,
      # log warnings about it and then run with a half-applied config.
      - task: renovate:config:validate
      - |
        echo "RENOVATE_REPOSITORY_CACHE=${RENOVATE_REPOSITORY_CACHE@Q}" >&2
        echo "RENOVATE_LOG_LEVEL=${RENOVATE_LOG_LEVEL@Q}" >&2
        echo "RENOVATE_AUTO_APPROVE=${RENOVATE_AUTO_APPROVE@Q}" >&2
      - docker compose run --quiet-build --quiet-pull -T --rm renovate
      - task: renovate:cache:export

  renovate:gha:run:
    desc: Run the renovate workflow against the current branch
    summary: |
      Dispatch .github/workflows/renovate.yml against the current branch, so a
      renovate-global.json5 or workflow change can be exercised with the real
      workflow, cache and token before it is merged.

      Defaults to a full dry run - no branches, PRs or comments, and the shared
      cache artifact is not overwritten. Override with
      `RENOVATE_GHA_DRY_RUN=disabled` for a real run from the branch.

      GitHub only offers workflow_dispatch for workflows that exist on the
      default branch, but it then runs the *branch's* copy of the workflow, and
      the config comes from the branch checkout, so both are under test.

      The run is watched to completion and its renovate-report artifact is
      downloaded to RENOVATE_REPORT_DIR.
    env:
      GITHUB_REPOSITORY:
        sh: gh repo view --json owner,name -q '.owner.login + "/" + .name'
      REF:
        sh: git branch --show-current
    vars:
      GHA_DRY_RUN: '{{.RENOVATE_GHA_DRY_RUN | default "full"}}'
      GHA_LOG_LEVEL: '{{.RENOVATE_GHA_LOG_LEVEL | default "debug"}}'
      REPORT_DIR: '{{.RENOVATE_REPORT_DIR | default "/tmp/renovate-gha-report"}}'
    cmds:
      - |
        set -euo pipefail

        declare -p REF GITHUB_REPOSITORY >&2

        # `gh workflow run` does not report the run it created, so remember the
        # newest run on this branch and wait for a different one to show up.
        LAST_RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow renovate.yml --branch "${REF}" --limit 1 --json databaseId --jq '.[0].databaseId // ""')"

        gh workflow run renovate.yml --repo "${GITHUB_REPOSITORY}" --ref "${REF}" \
          --field "dryRun={{.GHA_DRY_RUN}}" \
          --field "logLevel={{.GHA_LOG_LEVEL}}" \
          --field autoApprove=false

        RUN_ID="${LAST_RUN_ID}"
        while [ "${RUN_ID}" == "${LAST_RUN_ID}" ]; do
          sleep 4
          echo "Waiting for the renovate run on ${REF} to start..." >&2
          RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow renovate.yml --branch "${REF}" --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
        done
        declare -p RUN_ID >&2

        WATCH_STATUS=0
        gh run watch --repo "${GITHUB_REPOSITORY}" --exit-status "${RUN_ID}" || WATCH_STATUS="${?}"

        # The workflow uploads the report with `if: always()`, so it is there
        # for a failed run too - which is when it is most worth reading. A run
        # that died before the upload step has no artifact, which is not itself
        # an error worth masking the run's own status with.
        mkdir -p {{.REPORT_DIR | q}}
        if gh run download --repo "${GITHUB_REPOSITORY}" "${RUN_ID}" -n renovate-report --dir {{.REPORT_DIR | q}}; then
          echo "Renovate report downloaded to {{.REPORT_DIR}}" >&2
        else
          echo "No renovate-report artifact on run ${RUN_ID}" >&2
        fi

        exit "${WATCH_STATUS}"

  renovate:config:validate:
    desc: Validate the Renovate global config
    summary: |
      Validate the Renovate global config.

      Runs renovate-config-validator out of the same image the renovate
      service uses, so the validator always matches the Renovate that will
      consume the config. Passing the file as an argument makes the validator
      treat it as self-hosted global config, which is what this file is.
      --strict turns warnings into failures, including unknown options inside
      `repositories[0]`.

      Not part of `task validate`: that runs inside the devtools container,
      which has no docker socket and no renovate binary.
    cmds:
      - |
        set -euo pipefail
        # Validation needs no credentials, but compose interpolates these into
        # the service definition and warns when they are unset. --entrypoint="":
        # the service entrypoint installs Renovate's git hooks, which the
        # validator has no use for.
        RENOVATE_TOKEN="" RENOVATE_GITHUB_ACTIONS_TOKEN="" \
          docker compose run --entrypoint="" --quiet-build --quiet-pull -T --rm renovate \
          renovate-config-validator --strict /srv/workspace/renovate-global.json5

  renovate:report:export:
    desc: Export the Renovate report
    summary: |
      Export the Renovate report.

      This task exports the Renovate report to a file.
    cmds:
      - |
        set -euo pipefail
        mkdir -p "$(dirname -- "${RENOVATE_REPORT_FILE}")"
        docker compose run --entrypoint="" --quiet-build --quiet-pull -T --rm renovate cat /tmp/renovate/report.json > "${RENOVATE_REPORT_FILE}"
        echo "Renovate report exported successfully to ${RENOVATE_REPORT_FILE}" >&2

  renovate:cache:export:
    desc: Export the Renovate cache
    summary: |
      Export the Renovate cache

      This task exports the Renovate cache to a file.
    cmds:
      - |
        set -euo pipefail
        mkdir -p "$(dirname -- "${RENOVATE_CACHE_ARCHIVE}")"
        docker compose run --entrypoint="" --quiet-build --quiet-pull -T --rm renovate bash -c '
          set -Eeuo pipefail
          mkdir -p /tmp/renovate/cache >&2
          exec tar -czf - -C /tmp/renovate/cache .
        ' > "${RENOVATE_CACHE_ARCHIVE}.tmp"
        mv -v "${RENOVATE_CACHE_ARCHIVE}.tmp" "${RENOVATE_CACHE_ARCHIVE}"
        echo "Renovate cache exported successfully to ${RENOVATE_CACHE_ARCHIVE}." >&2

  renovate:cache:import:
    desc: Import the Renovate cache
    summary: |
      Import the Renovate cache

      This task imports the Renovate cache from a file.
    cmds:
      - |
        set -euo pipefail
        if [ ! -e "${RENOVATE_CACHE_ARCHIVE}" ] ; then
          echo "No cache found." >&2
        else
          echo "Restoring cache from ${RENOVATE_CACHE_ARCHIVE}" >&2
          if cat "${RENOVATE_CACHE_ARCHIVE}" | docker compose run --entrypoint="" --quiet-build --quiet-pull -T --rm renovate bash -c '
            set -Eeuo pipefail </dev/null
            rm -rf /tmp/renovate/cache </dev/null
            mkdir -p /tmp/renovate/cache </dev/null
            exec tar -xzf - -C /tmp/renovate/cache .
          '
          then
            echo "Renovate cache imported successfully from ${RENOVATE_CACHE_ARCHIVE}." >&2
          else
            echo "Failed to import Renovate cache from ${RENOVATE_CACHE_ARCHIVE}." >&2
          fi
          rm -r "${RENOVATE_CACHE_ARCHIVE}"
        fi

  renovate:env:run:
    desc: Extract renovate secrets
    env:
      TMP_DIR:
        sh: |
          set -euo pipefail;
          mktemp -d -t renovate-env-XXXXXXXXXX
      GITHUB_REPOSITORY:
        sh: gh repo view --json owner,name -q '.owner.login + "/" + .name'
    cmds:
      - defer: |
          if [ -e "${TMP_DIR}/run_id" ]; then
            RUN_ID="$(cat "${TMP_DIR}/run_id")"
            echo "Canceling Renovate run ${RUN_ID}..." >&2
            gh run cancel --repo "${GITHUB_REPOSITORY}" "${RUN_ID}" || true
          fi

          echo "Removing all the temp files";
          rm -vfr "${TMP_DIR}"
      - |
        set -euo pipefail

        gh workflow run renovate-env.yml --field lifetime=600 --field "gpg_public_key=$(gpg --armor --export)" --ref main
        RUN_ID=""
        while [ -z "${RUN_ID}" ]; do
          sleep 4
          echo "Waiting for Renovate run to start..."
          RUN_ID="$(gh run list --workflow renovate-env.yml --branch main --status=in_progress --json 'number,databaseId' --jq '[sort_by(.number) | reverse][0][0].databaseId')"
        done
        echo "RUN_ID=${RUN_ID@Q}" >&2
        echo "${RUN_ID}" > "${TMP_DIR}/run_id"
      - |
        set -euo pipefail

        while ! [ -e "${TMP_DIR}/renovate-env.asc" ]; do
          echo "Waiting for download to complete..."
          sleep 2
          (cd "${TMP_DIR}"; gh run --repo "${GITHUB_REPOSITORY}" download "$(cat "${TMP_DIR}/run_id")" -n renovate-env)
        done
        source <(gpg --decrypt -i "${TMP_DIR}/renovate-env.asc" | tee /dev/stderr)
        export RENOVATE_GITHUB_ACTIONS_TOKEN
        export RENOVATE_TOKEN
        {{.CLI_ARGS}}

  ghcr:init:
    env:
      DOCKERFILE: |
        FROM scratch
        LABEL description="Empty Docker image"
      GITHUB_REPOSITORY:
        sh: gh repo view --json owner,name -q '.owner.login + "/" + .name'
    cmds:
      - |
        echo "${DOCKERFILE}" | docker build -t ghcr.io/${GITHUB_REPOSITORY}:empty -f - .
        docker push ghcr.io/${GITHUB_REPOSITORY}:empty

  ssh-debug:rotate-keypair:
    desc: Rotate the SSH keypair
    env:
      GITHUB_REPOSITORY:
        sh: gh repo view --json owner,name -q '.owner.login + "/" + .name'
    cmds:
      - |
        set -x -euo pipefail
        DESCRIPTION="${GITHUB_REPOSITORY}/ssh-debug"
        ngrok api ssh-credentials list |
          jq -r '.ssh_credentials[] | select(.description == "'"${DESCRIPTION}"'") | .id' |
          xargs --no-run-if-empty -n1 -t ngrok api ssh-credentials delete

        PRIVATE_KEY="$(openssl genrsa 4096)"
        PUBLIC_KEY="$(ssh-keygen -y -f /dev/stdin <<< "${PRIVATE_KEY}")"

        gh secret set NGROK_SSH_PRIVATE_KEY <<< "${PRIVATE_KEY}"

        ngrok api ssh-credentials create --description "${DESCRIPTION}" --public-key "${PUBLIC_KEY}"

  ssh-debug:
    desc: Connect to GitHub actions via ssh
    env:
      GITHUB_REPOSITORY:
        sh: gh repo view --json owner,name -q '.owner.login + "/" + .name'
      TMP_DIR:
        sh: |
          set -euo pipefail;
          mktemp -d -t ssh-debug-XXXXXXXXXX
    cmds:
      - defer: |
          if [ -e "${TMP_DIR}/run_id" ]; then
            RUN_ID="$(cat "${TMP_DIR}/run_id")"
            echo "Canceling Renovate run ${RUN_ID}..." >&2
            gh run cancel --repo "${GITHUB_REPOSITORY}" "${RUN_ID}" || true
          fi

          echo "Removing all the temp files";
          rm -vfr "${TMP_DIR}"
      - |
        set -x -euo pipefail

        gh workflow run ssh-debug.yml --field "ssh_public_key=$(cat ~/.ssh/id_rsa.pub)" --ref main
        RUN_ID=""
        while [ -z "${RUN_ID}" ]; do
          echo "Waiting for ssh-debug run to start..."
          sleep 4
          RUN_ID="$(gh run list --workflow ssh-debug.yml --branch main --status=in_progress --json 'number,databaseId' --jq '[sort_by(.number) | reverse][0][0].databaseId')"
        done
        echo "RUN_ID=${RUN_ID@Q}" >&2
        echo "${RUN_ID}" > "${TMP_DIR}/run_id"

        export DESCRIPTION="${GITHUB_REPOSITORY}/ssh-debug"
        export SSH_CREDENTIAL_ID="$(ngrok api ssh-credentials list | jq -r '[.ssh_credentials[] | select(.description == env.DESCRIPTION) | .id][0]' | tee /dev/stderr)"
        TUNNEL_SESSION_ID=""
        while [ -z "${TUNNEL_SESSION_ID}" ]; do
          sleep 4
          export TUNNEL_SESSION_ID="$(ngrok api tunnel-sessions list | jq -r '[.tunnel_sessions[] | select(.credential.id == env.SSH_CREDENTIAL_ID) | .id][0]' | tee /dev/stderr)"
        done

        export TUNNEL_PUBLIC_URL="$(ngrok api tunnels list | jq -r '[.tunnels[] | select(.tunnel_session.id == env.TUNNEL_SESSION_ID) | .public_url | sub("^tcp://"; "")][0]' | tee /dev/stderr)"
        export TUNNEL_HOST="${TUNNEL_PUBLIC_URL%%:*}"
        export TUNNEL_PORT="${TUNNEL_PUBLIC_URL##*:}"
        ssh -p "${TUNNEL_PORT}" runner@"${TUNNEL_HOST}" {{.CLI_ARGS}}
